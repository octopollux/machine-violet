name: CI

on:
  push:
    branches: [main, release, two-tiers]
  pull_request:
    branches: [main, release]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Runtime diagnostic regression tests
        run: node --import tsx/esm --test scripts/runtime-info.test.ts

      # Build shared package first (engine and client-ink depend on it)
      - name: Build shared
        run: npm run build -w packages/shared

      - name: Lint + Test
        run: npm run check
